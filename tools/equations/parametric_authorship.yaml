# Parametric Authorship Equations
# YAML schema for equation rendering and footnote generation
#
# Usage: python render_equations.py equations/parametric_authorship.yaml
#
# Version history:
#   1.0 - Initial extraction from parametric_authorship.md
#   1.1 - Notational corrections (norm bars, expectation subscripts)

meta:
  title: "Parametric Authorship Equations"
  version: "1.1"
  output_dir: "../projects/theses/assets/parametric_authorship_equations_cards_mathtext"
  style:
    width: 1080
    height: 566
    margin: 0.07
    bg_gray: 0.5
    text_color: "white"
    math_fontset: "stixsans"
    start_fontsize: 64
    min_fontsize: 20
  render_footnotes: false  # Set true to generate companion text cards

equations:
  - slug: "01_generator_map"
    name: "Generator Mapping"
    latex: "$G:\\,(\\,S,P,C,E\\,)\\mapsto\\mathcal{A}$"
    section: "§3.2, Appendix A"
    footnote: |
      The Grand Machine takes your ingredients (tools, settings, rules, and
      whatever chaos the universe throws in) and produces... stuff. Lots of
      stuff, potentially. It's rather like a sausage machine, except the
      sausages might be poems or paintings, and nobody's entirely certain
      what went in. The important bit is that it's a *machine*—give it the
      same ingredients, it'll give you the same family of sausages, near
      enough.†

      †Near enough. Which in mathematics means "don't ask about the edge
      cases unless you've brought drinks."

  - slug: "02_paf_tuple"
    name: "PAF Tuple"
    latex: "$\\mathrm{PAF}:=\\langle S,\\ \\mathcal{P},\\ C,\\ E,\\ \\Phi\\rangle$"
    section: "§3.2"
    footnote: |
      This is your authorship packed into a lunchbox: your tools (S), your
      knobs to twiddle (𝒫), your rules about what's absolutely forbidden (C),
      the weather outside (E), and crucially—how much the whole thing wobbles
      when you actually *do* twiddle the knobs (Φ). The revelation here is
      that the lunchbox is the author. Not the sandwich. Not you. The
      *arrangement*. This troubles people who were hoping they were still
      in charge.

  - slug: "03_param_space"
    name: "Parameter Space"
    latex: "$\\mathcal{P}\\subseteq\\mathbb{R}^{n}$"
    section: "§3.2"
    footnote: |
      Your knobs live in a big box of numbers. It's got *n* dimensions, which
      is mathematician for "quite a lot of knobs, possibly more than three,
      and good luck visualising that." The ⊆ means your particular knobs are
      allowed to live *somewhere* in the big box, but not necessarily
      everywhere. Think of it as zoning regulations for creativity.

  - slug: "04_phi_def"
    name: "Shaping Functional"
    latex: "$\\Phi=\\frac{\\partial\\mathcal{F}}{\\partial P}$"
    section: "§3.2"
    footnote: |
      How much does the *interesting stuff* change when you nudge your
      settings? That's Φ. It's the derivative, which is calculus for "the
      thing that tells you whether poking this button will do anything worth
      poking it for." A high Φ means small tweaks, big changes. A low Φ means
      you could twist knobs all day and nobody would notice. Most of us have
      experienced both in committee meetings.

  - slug: "05_agency_metric"
    name: "Agency Metric"
    # Corrected: using ‖·‖ (norm) instead of |·| (absolute value)
    latex: "$\\operatorname{Auth}^{\\star}=\\Vert\\nabla_{P}\\mathbb{E}_{G}\\!\\left[\\,\\mathcal{F}(\\,G\\,)\\,\\right]\\Vert\\cdot\\operatorname{Inv}_{\\varepsilon}(\\,P\\!\\to\\!\\mathcal{F}\\,)\\cdot R(\\,C,E\\,)\\cdot\\prod_{i}d_i$"
    section: "§3.2"
    notes: "Corrected v1.1: |·| → ‖·‖ (using Vert), added subscript to expectation"
    footnote: |
      How much are you *actually* the author? Well, it depends.

      First: does twiddling your knobs actually *do* anything observable?
      (That's the gradient bit.)

      Second: when you're not twiddling, does the thing stay put? (That's
      Invariance—points for things that don't wander off when you stop
      watching them.)

      Third: are you actually allowed to run this? (Risk and readiness—
      someone checked, presumably.)

      Fourth: is everyone's dignity intact? Personal dignity, respect for
      your materials, and the system not being a total shambles—multiply
      them together. If *any* of these goes to zero, your authorship is
      zilch. This is the mathematical equivalent of "you're only as strong
      as your weakest excuse."†

      †The ∏ symbol means "multiply everything together." Mathematicians
      love Greek letters. It makes them feel continental.

  - slug: "06_d_bounds"
    name: "Dignity Bounds"
    latex: "$d_i\\in[0,1]$"
    section: "§3.2, §3.4"
    footnote: |
      Dignity gets a score between zero (absolutely none—someone has been
      treated like furniture) and one (full dignity intact—everyone's been
      asked nicely and said yes). This applies to *you*, to *the things
      you're working with*, and to *the whole rickety system*. There are
      three dignities, and they all need feeding.

  - slug: "07_dignity_tensor"
    name: "Dignity Tensor"
    latex: "$\\mathbf{D}=\\operatorname{diag}(\\,d_{\\mathrm{personal}},\\,d_{\\mathrm{object}},\\,d_{\\mathrm{system}}\\,)$"
    section: "§3.4"
    footnote: |
      Line up your three dignities on the diagonal of a matrix. Why a matrix?
      Because mathematicians need something to do with their hands, and it
      lets you do operations on all three at once without playing favorites.
      Also, saying "dignity tensor" in meetings makes everyone pause
      respectfully, which is sometimes the whole point.

  - slug: "08_illum_constraint"
    name: "Illumination Constraint"
    latex: "$I(\\,r\\,)=\\frac{\\alpha\\,A_{\\mathrm{open}}}{r^{2}}\\leq \\tau$"
    section: "§4 Quad Face Protocol"
    footnote: |
      Light gets dimmer the further you are from the lamp—specifically, it
      falls off with the *square* of the distance. This formula says your
      work's "brightness" (how exposed it is, how legible, how *seen*) is
      your openness (A_open) times how much you're letting through (α),
      divided by how far it's travelling (r²).

      The τ is your consent ceiling: "this bright and no brighter, or
      someone hasn't agreed to be looked at."

      Want to publish far and wide? Either dial down the intimacy, shrink
      your audience, or get better consent. Those are your three doors.
      Pick one or get blocked.†

      †The inverse-square law was discovered by people who were trying to
      light their houses before electricity. They had to care about this
      sort of thing. Now you do too, except about exposure instead of candles.

  - slug: "09_feature_map"
    name: "Feature Extractor"
    latex: "$\\mathcal{F}:\\mathcal{A}\\to\\mathbb{R}^{k}$"
    section: "Appendix A"
    footnote: |
      You've made something. Now, what *about* it? The Feature Extractor
      looks at your artifact(s) and produces a list of *k* numbers describing
      the interesting bits—color, density, how angry it looks, whatever you
      care to measure. It's like a very picky food critic, except instead of
      "hints of oak" you get "vector component seven is 0.34."

  - slug: "10_invariant_set"
    name: "Invariant Set"
    # Corrected: |ΔP| → ‖ΔP‖, added δ tolerance
    latex: "$I=\\{\\,f\\in\\mathcal{F}\\mid \\Vert f(\\,G(\\,P+\\Delta P\\,)\\,)-f(\\,G(\\,P\\,)\\,)\\Vert\\leq\\delta\\ \\forall\\,\\Vert\\Delta P\\Vert\\leq\\varepsilon\\,\\}$"
    section: "Appendix A"
    notes: "Corrected v1.1: ≈ → explicit δ tolerance, |·| → ‖·‖ (using Vert)"
    footnote: |
      What *doesn't* change when you jiggle the controls a little bit? Those
      are your invariants—the features that stubbornly stay put even when you
      poke them. They're the personality of your rule-set. If you nudge your
      settings (ΔP, a small nudge) and certain features (f) refuse to budge,
      congratulations: that's your style. That's the stable bit. That's what
      you can take credit for.†

      †The δ is the tolerance ("close enough"). ε is "a small amount." In
      academic papers, these always turn out to be more complicated than
      they sound. Welcome to mathematics.

  - slug: "11_transition_set"
    name: "Transition Set"
    latex: "$T=\\{\\,(\\,f,\\Delta P\\,)\\mid f(\\,G(\\,P+\\Delta P\\,)\\,)-f(\\,G(\\,P\\,)\\,)\\in\\Delta^{\\star}\\,\\}$"
    section: "Appendix A"
    footnote: |
      What *does* change, *on purpose*, when you throw a planned spanner in
      the works? If you've said "when I toggle this obstruction, the mood
      should shift," and it *does*, and the shift is *in the set of changes
      you declared acceptable* (Δ*)—that's a designed transition. Not an
      accident. Not chaos. Intentional drift. It's the difference between
      "I meant to do that" and "oh dear."

  - slug: "12_radius_form"
    name: "Radius Form"
    latex: "$r\\geq \\sqrt{\\frac{\\alpha\\,A_{\\mathrm{open}}}{\\tau}}$"
    section: "§4 Quad Face Protocol"
    footnote: |
      This is equation 8, rearranged. If you know your openness, your
      transmissivity, and your consent ceiling, you can calculate the
      *minimum* distance your work has to travel before it's dim enough to
      be safe. Close audiences: more intimate. Distant audiences: needs
      more consent or less content.

      Mathematics is very keen on rearranging things. It makes the same
      idea look like new ideas. Publish enough rearrangements and you can
      have a career.

# Bonus equation (not rendered as card, but included for completeness)
bonus_equations:
  - slug: "diow_conformance"
    name: "DIOW Conformance"
    latex: "$\\forall o\\in S_{\\mathrm{impl}}:\\; \\texttt{Header}(\\,\\kappa(\\,o\\,)\\,) \\wedge \\texttt{Ledger}(\\,\\kappa(\\,o\\,)\\,) \\wedge \\texttt{Exit}(\\,\\kappa(\\,o\\,)\\,) \\wedge \\texttt{Lint}(\\,\\kappa(\\,o\\,)\\,)$"
    section: "§3.5"
    footnote: |
      Every actual tool or host you use (the *implementations*, lurking
      behind the scenes) must plug into four sockets: it must tell you what
      it is (Header), keep records (Ledger), let you leave (Exit), and pass
      the dignity checks (Lint). *All four*, joined with ∧ (and). Fail any
      one and you're not allowed to plug it in.

      This is "dependency inversion"—your rules don't beg the tools to
      behave; the tools must prove they're worthy of your rules. It's like
      demanding references before you hire someone, except the someone is
      an AI model and the references are "do you respect consent, keep
      receipts, and let people quit?"†

      †Most tools would fail this test. That's the point.
